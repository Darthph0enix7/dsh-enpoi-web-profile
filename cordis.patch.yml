# Enpoi Harness profile patch layer (applied after every bundle layer).
#
# better-sidebar was retired in the 0.1.5 sync: the first-party right sidebar
# (ui-sidebar-right + ui-sidebar-files + ui-sidebar-documentpreview + ui-dockkit)
# now owns docking, previews, resize, splits, and chat→preview opens.
#
# This is also the document the merged config-editor writes: the settings
# service imports a legacy `settings.yaml` section into the profile entry of
# the same id and persists the row here, so operator edits (and the one-shot
# settings.yaml import at the 0.1.7 switch) land as ordinary patch rows.
#
# Must remain a top-level YAML array of loader patch entries.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: opencode-go
    model: deepseek-v4.1-flash
    chain: diag
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
    fontSize: 14
- id: enpoi-orchestration
  name: dsh-enpoi-capabilities
  config:
    capabilities:
      tools:
        oracle_review: true
        roundtable: true
        keeper: true
        librarian: true
      skills:
        project-management: false
        tier1-workflow: true
        tier3-workflow: true
        tier2-workflow: true
        ue-mcp: false
      mcp:
        plane-mcp: false
    mcpServers:
      plane-mcp:
        serverName: plane
        transport: streamable-http
        url: http://127.0.0.1:8211/http/api-key/mcp
        apiKeyEnv: PLANE_MCP_TOKEN
        headers:
          x-workspace-slug: main_base
    mcpStatus:
      plane-mcp:
        state: online
        mounted: false
        checkedAt: 1790454172533
    personas:
